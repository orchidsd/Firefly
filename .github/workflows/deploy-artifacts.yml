name: Deploy Artifacts and Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "artifacts-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: pnpm run build
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Copy wrangler config into dist
        run: cp wrangler.toml dist/

      - name: Deploy to Artifacts Repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          external_repository: ${{ secrets.ARTIFACTS_REPO }}
          publish_dir: ./dist
          publish_branch: main
          destination_dir: .
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy artifacts from ${{ github.repository }}@${{ github.sha }}'

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout artifacts repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ARTIFACTS_REPO }}
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler@4 deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}